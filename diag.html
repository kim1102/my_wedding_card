<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>청첩장 애니메이션 진단</title>
<style>
  :root{ color-scheme: light; }
  body{
    margin:0; padding:22px 18px 60px;
    background:#FBF8F3; color:#3A342C;
    font:15px/1.7 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
         'Malgun Gothic', sans-serif;
  }
  h1{ font-size:19px; margin:0 0 4px; }
  .sub{ margin:0 0 22px; color:#9A9083; font-size:13px; }
  .verdict{
    padding:16px 16px; border-radius:6px; margin:0 0 22px;
    font-size:15px; line-height:1.65;
  }
  .ok  { background:#E9F3EA; border:1px solid #BEDCC2; }
  .bad { background:#FBEDE9; border:1px solid #EAC7BC; }
  .wait{ background:#F3EDE2; border:1px solid #E3DACB; color:#6B6357; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ text-align:left; padding:9px 4px; border-bottom:1px solid #E5DCCC; vertical-align:top; }
  th{ color:#6B6357; font-weight:400; width:44%; }
  td{ font-variant-numeric:tabular-nums; }
  .y{ color:#2E7D3A; } .n{ color:#B5473A; }
  #box{ margin:24px 0 6px; height:34px; position:relative; background:#F3EDE2; border-radius:4px; overflow:hidden; }
  #dot{
    position:absolute; top:5px; left:0; width:24px; height:24px; border-radius:50%;
    background:#B0956A; animation:slide 1.6s linear infinite;
  }
  @keyframes slide{ from{ left:2px } to{ left:calc(100% - 26px) } }
  .cap{ font-size:12px; color:#9A9083; margin:0 0 24px; }
  .ua{ font-size:11px; color:#9A9083; word-break:break-all; margin-top:20px; }
</style>
</head>
<body>

<h1>청첩장 애니메이션 진단</h1>
<p class="sub">이 페이지를 청첩장이 안 움직이는 그 폰에서 열어주세요.<br>3초쯤 걸립니다.</p>

<div class="verdict wait" id="verdict">재는 중…</div>

<div id="box"><div id="dot"></div></div>
<p class="cap">위 점이 좌우로 움직여야 정상입니다. 멈춰 있으면 CSS 애니메이션이 죽은 것입니다.</p>

<table id="tbl"></table>
<p class="ua" id="ua"></p>

<script>
(function () {
  const rows = [];
  const yn = (v) => v ? '<span class="y">예</span>' : '<span class="n">아니오</span>';
  const add = (k, v) => rows.push('<tr><th>' + k + '</th><td>' + v + '</td></tr>');

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hasCanvas = !!document.createElement('canvas').getContext;

  // 1) requestAnimationFrame 이 실제로 도는지 1초간 센다
  let frames = 0;
  const t0 = performance.now();
  (function tick() {
    frames++;
    if (performance.now() - t0 < 1000) requestAnimationFrame(tick);
    else finish();
  })();

  function finish() {
    const fps = Math.round(frames / ((performance.now() - t0) / 1000));

    // 2) CSS 애니메이션이 실제로 진행되는지 확인
    const dot = document.getElementById('dot');
    const a = dot.getAnimations ? dot.getAnimations() : [];
    const cssRunning = a.length > 0 && a[0].playState === 'running' &&
                       Number(a[0].currentTime) > 0;

    add('동작 줄이기 켜짐', reduced ? '<span class="n">예 ← 원인</span>' : '<span class="y">아니오</span>');
    add('화면 갱신 속도', (fps >= 30 ? '<span class="y">' : '<span class="n">') + fps + ' fps</span>');
    add('CSS 애니메이션 작동', yn(cssRunning));
    add('캔버스 지원', yn(hasCanvas));
    add('IntersectionObserver', yn('IntersectionObserver' in window));
    add('ResizeObserver', yn('ResizeObserver' in window));
    add('화면 배율 / 가로', devicePixelRatio + '× / ' + innerWidth + 'px');
    document.getElementById('tbl').innerHTML = rows.join('');

    const ua = navigator.userAgent;
    const inApp = /KAKAOTALK/i.test(ua) ? '카카오톡 인앱 브라우저'
                : /Instagram|FBAN|FBAV|Line\//i.test(ua) ? '다른 앱의 인앱 브라우저'
                : '일반 브라우저';
    document.getElementById('ua').textContent = inApp + ' · ' + ua;

    const v = document.getElementById('verdict');
    if (reduced) {
      v.className = 'verdict bad';
      v.innerHTML = '<b>원인을 찾았습니다 — 「동작 줄이기」가 켜져 있습니다.</b><br><br>' +
        '아이폰: 설정 → 손쉬운 사용 → 동작 → <b>동작 줄이기</b> 끄기<br>' +
        '안드로이드: 설정 → 접근성 → <b>애니메이션 제거</b> 끄기<br><br>' +
        '<b>저전력 모드</b>를 켜두셔도 같은 증상이 납니다. 함께 확인해 주세요.';
    } else if (fps < 30 || !cssRunning) {
      v.className = 'verdict bad';
      v.innerHTML = '<b>브라우저가 화면을 거의 안 그리고 있습니다 (' + fps + ' fps).</b><br><br>' +
        '<b>저전력 모드</b>가 켜져 있거나, 탭이 백그라운드이거나, 기기가 매우 바쁜 상태입니다. ' +
        '저전력 모드를 끄고 이 페이지를 다시 열어보세요.';
    } else {
      v.className = 'verdict ok';
      v.innerHTML = '<b>이 폰은 애니메이션에 문제가 없습니다 (' + fps + ' fps).</b><br><br>' +
        '청첩장에서 안 보이셨다면 다른 원인입니다. 이 표를 그대로 알려주세요.';
    }
  }
})();
</script>
</body>
</html>
