<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김민수 ♥ 설유민 결혼합니다</title>
<meta name="theme-color" content="#FBF8F3">

<!-- 홈 화면에 추가하면 주소창 없이 전체화면으로 열립니다 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="민수 & 유민">
<link rel="apple-touch-icon" href="images/icon/apple-touch-icon.png">
<link rel="icon" href="images/icon/icon-192.png">

<!-- 카카오톡/문자 공유 미리보기
     ★ 배포 후에는 og:image / og:url 을 https 로 시작하는 전체 주소로 바꿔야
       카카오톡 미리보기에 사진이 뜹니다. (상대경로는 못 읽어옵니다) -->
<meta property="og:type" content="website">
<meta property="og:title" content="김민수 ♥ 설유민 결혼합니다">
<meta property="og:description" content="2026년 10월 3일 토요일 오후 1시 30분 · 포스코센터 아트홀 동관 4층">
<meta property="og:image" content="https://kim1102.github.io/my_wedding_card/images/gallery/gal0.jpg">
<meta property="og:url" content="https://kim1102.github.io/my_wedding_card/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= 배경음악 ================= -->
<div class="bgm-anchor" aria-hidden="false">
  <button type="button" class="lang" id="langToggle" data-next="tw">繁體中文</button>
  <button class="bgm" id="bgmToggle" type="button" aria-pressed="false" aria-label="배경음악 켜기" hidden>
    <svg class="bgm__note" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
    </svg>
    <svg class="bgm__slash" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M4 20L20 4"/>
    </svg>
  </button>
</div>
<audio id="bgm" loop preload="none"></audio>

<div class="frame">

  <!-- ================= HERO ================= -->
  <header class="hero">
    <div class="hero__photo">
      <img id="mainPhoto" src="" alt="신랑 신부 사진">
      <p class="hero__script" aria-hidden="true"><span style="animation-delay:0.35s">We</span><span style="animation-delay:0.57s">are</span><span style="animation-delay:0.79s">getting</span><span style="animation-delay:1.01s">married</span></p>
    </div>
    <div class="hero__body">
      <p class="hero__label" data-en>THE WEDDING DAY</p>
      <h1 class="hero__names">
        <span id="heroGroom"></span>
        <span class="hero__amp">&amp;</span>
        <span id="heroBride"></span>
      </h1>
      <p class="hero__date" id="heroDate"></p>
      <p class="hero__venue" id="heroVenue"></p>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </div>
  </header>

  <!-- ================= 인사말 ================= -->
  <section class="section reveal" id="greeting">
    <p class="section__eyebrow" data-en>INVITATION</p>
    <h2 class="section__title" id="greetTitle"></h2>
    <div class="divider"><span></span></div>
    <p class="greeting__body" id="greetBody"></p>

    <div class="parents" id="parents"></div>
    <button class="btn-contact" id="openContact">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span data-t="contact">연락하기</span>
    </button>
  </section>

  <!-- ================= 일시 / 달력 ================= -->
  <section class="section section--alt reveal" id="date">
    <p class="section__eyebrow" data-en>SAVE THE DATE</p>
    <h2 class="section__title" id="dateHeadline"></h2>
    <div class="divider"><span></span></div>

    <div class="calendar" id="calendar"></div>
    <p class="dday" id="dday"></p>
  </section>

  <!-- ================= 갤러리 ================= -->
  <section class="section reveal" id="gallery">
    <p class="section__eyebrow" data-en>GALLERY</p>
    <h2 class="section__title" data-t="galleryTitle">우리의 순간</h2>
    <div class="divider"><span></span></div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- ================= 오시는 길 ================= -->
  <section class="section section--alt reveal" id="location">
    <p class="section__eyebrow" data-en>LOCATION</p>
    <h2 class="section__title" data-t="locationTitle">오시는 길</h2>
    <div class="divider"><span></span></div>

    <p class="loc__venue" id="locVenue"></p>
    <p class="loc__hall" id="locHall"></p>
    <p class="loc__addr" id="locAddr"></p>

    <div class="map" id="map">
      <svg class="map__draw" viewBox="0 0 480 330" role="img" aria-label="포스코센터 약도. 테헤란로 남쪽, 선릉역과 삼성역 사이."><rect width="480" height="330" fill="#FFFDFA"/><g stroke-width="1"><rect x="8" y="38" width="58" height="66" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="13" y1="54.5" x2="61" y2="54.5" stroke="#EAE2D3"/><line x1="13" y1="71" x2="61" y2="71" stroke="#EAE2D3"/><line x1="13" y1="87.5" x2="61" y2="87.5" stroke="#EAE2D3"/><rect x="120" y="38" width="76" height="66" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="125" y1="54.5" x2="191" y2="54.5" stroke="#EAE2D3"/><line x1="125" y1="71" x2="191" y2="71" stroke="#EAE2D3"/><line x1="125" y1="87.5" x2="191" y2="87.5" stroke="#EAE2D3"/><rect x="206" y="38" width="76" height="66" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="211" y1="51.2" x2="277" y2="51.2" stroke="#EAE2D3"/><line x1="211" y1="64.4" x2="277" y2="64.4" stroke="#EAE2D3"/><line x1="211" y1="77.6" x2="277" y2="77.6" stroke="#EAE2D3"/><line x1="211" y1="90.8" x2="277" y2="90.8" stroke="#EAE2D3"/><rect x="292" y="38" width="66" height="66" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="297" y1="54.5" x2="353" y2="54.5" stroke="#EAE2D3"/><line x1="297" y1="71" x2="353" y2="71" stroke="#EAE2D3"/><line x1="297" y1="87.5" x2="353" y2="87.5" stroke="#EAE2D3"/><rect x="412" y="38" width="60" height="66" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="417" y1="54.5" x2="467" y2="54.5" stroke="#EAE2D3"/><line x1="417" y1="71" x2="467" y2="71" stroke="#EAE2D3"/><line x1="417" y1="87.5" x2="467" y2="87.5" stroke="#EAE2D3"/><rect x="8" y="248" width="58" height="74" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="13" y1="266.5" x2="61" y2="266.5" stroke="#EAE2D3"/><line x1="13" y1="285" x2="61" y2="285" stroke="#EAE2D3"/><line x1="13" y1="303.5" x2="61" y2="303.5" stroke="#EAE2D3"/><rect x="118" y="248" width="24" height="74" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="123" y1="262.8" x2="137" y2="262.8" stroke="#EAE2D3"/><line x1="123" y1="277.6" x2="137" y2="277.6" stroke="#EAE2D3"/><line x1="123" y1="292.4" x2="137" y2="292.4" stroke="#EAE2D3"/><line x1="123" y1="307.2" x2="137" y2="307.2" stroke="#EAE2D3"/><rect x="338" y="248" width="20" height="74" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="343" y1="262.8" x2="353" y2="262.8" stroke="#EAE2D3"/><line x1="343" y1="277.6" x2="353" y2="277.6" stroke="#EAE2D3"/><line x1="343" y1="292.4" x2="353" y2="292.4" stroke="#EAE2D3"/><line x1="343" y1="307.2" x2="353" y2="307.2" stroke="#EAE2D3"/><rect x="412" y="248" width="60" height="74" rx="2" fill="#F4EFE4" stroke="#E5DCCB"/><line x1="417" y1="266.5" x2="467" y2="266.5" stroke="#EAE2D3"/><line x1="417" y1="285" x2="467" y2="285" stroke="#EAE2D3"/><line x1="417" y1="303.5" x2="467" y2="303.5" stroke="#EAE2D3"/></g><g fill="#ECE5D9"><rect x="0" y="134" width="480" height="60"/><rect x="74" y="0" width="38" height="330"/><rect x="366" y="0" width="38" height="330"/></g><line x1="0" y1="164" x2="480" y2="164" stroke="#FFFDFA" stroke-width="2" stroke-dasharray="11 10"/><text x="8" y="152" font-size="14" fill="#9A9083">← 역삼</text><text x="472" y="152" font-size="14" fill="#9A9083" text-anchor="end">종합운동장 →</text><text x="240" y="186" font-size="17" fill="#6B6357" text-anchor="middle" letter-spacing="5">테헤란로</text><circle cx="93" cy="164" r="17" fill="#00A84D"/><text x="93" y="170" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="93" y="126" font-size="17" fill="#3A342C" text-anchor="middle">선릉역</text><circle cx="385" cy="164" r="17" fill="#00A84D"/><text x="385" y="170" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="385" y="126" font-size="17" fill="#3A342C" text-anchor="middle">삼성역</text><rect x="138.5" y="200" width="23" height="23" rx="3" fill="#3A342C"/><text x="150" y="217" font-size="14" fill="#fff" text-anchor="middle">1</text><text x="150" y="240" font-size="14" fill="#6B6357" text-anchor="middle">1번 출구</text><rect x="318.5" y="200" width="23" height="23" rx="3" fill="#3A342C"/><text x="330" y="217" font-size="14" fill="#fff" text-anchor="middle">4</text><text x="330" y="240" font-size="14" fill="#6B6357" text-anchor="middle">4번 출구</text><path d="M200 196 L200 236" stroke="#B0956A" stroke-width="2.5" fill="none"/><path d="M200 248 L194.5 236 L205.5 236 Z" fill="#B0956A"/><text x="211" y="230" font-size="12.5" fill="#B0956A">주차장 입구</text><rect x="150" y="248" width="180" height="74" rx="3" fill="#B0956A"/><text x="240" y="280" font-size="19" fill="#FFFDFA" text-anchor="middle" letter-spacing="1">포스코센터</text><text x="240" y="303" font-size="14" fill="#F5E9D4" text-anchor="middle">아트홀 · 동관 4층</text><g fill="#C9BEA9"><path d="M455 8 L459.5 20 L455 17 L450.5 20 Z"/><text x="455" y="32" font-size="12" text-anchor="middle">N</text></g></svg>
    </div>

    <div class="map-links" id="mapLinks"></div>

    <div class="directions" id="directions"></div>
  </section>

  <!-- ================= 마음 전하실 곳 ================= -->
  <section class="section reveal" id="accounts">
    <p class="section__eyebrow" data-en>WITH YOUR HEART</p>
    <h2 class="section__title" data-t="accountsTitle">마음 전하실 곳</h2>
    <div class="divider"><span></span></div>
    <p class="accounts__note" data-t-html="accountsNote">참석이 어려우신 분들을 위해<br>계좌번호를 안내드립니다.</p>
    <div class="accordion" id="accountList"></div>
  </section>

  <!-- ================= 맺음 사진 ================= -->
  <section class="interlude reveal" id="interlude" aria-label="신랑 신부 사진">
    <img id="interludePhoto" src="" alt="신랑 신부 사진">
  </section>

  <!-- ================= 푸터 ================= -->
  <footer class="footer reveal">
    <p class="footer__names" id="footerNames"></p>
    <p class="footer__note" data-t="footerNote">잘 살겠습니다!</p>
    <div class="share-row">
      <button class="share-btn" id="shareLink">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span data-t="shareLink">링크 복사</span>
      </button>
      <button class="share-btn" id="shareSystem">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
        <span data-t="shareSystem">공유하기</span>
      </button>
    </div>
  </footer>

</div>

<!-- ================= 라이트박스 ================= -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
  <button class="lb__close" id="lbClose" aria-label="닫기">&times;</button>
  <button class="lb__nav lb__prev" id="lbPrev" aria-label="이전 사진">&#8249;</button>
  <div class="lb__stage" id="lbStage"><img id="lbImg" src="" alt=""></div>
  <button class="lb__nav lb__next" id="lbNext" aria-label="다음 사진">&#8250;</button>
  <p class="lb__count" id="lbCount"></p>
</div>

<!-- ================= 연락처 시트 ================= -->
<div class="sheet" id="contactSheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="연락처">
    <div class="sheet__grip"></div>
    <h3 class="sheet__title" data-t="contactTitle">연락하기</h3>
    <div class="sheet__body" id="contactList"></div>
    <button class="sheet__close" data-close data-t="close">닫기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
